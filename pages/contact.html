<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bpmf+Huninn&family=Commissioner:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Mi tienda</title>
</head>
<body>
    <header>
        <div><a href="../index.html"><img src="../img/logo.png" class="logo" alt="Logo de tienda"></a></div>

        <nav>
            <ul class="nav">
                <li class="item"><a href="../index.html">Inicio</a></li>
                <li class="item"><a href="../pages/contact.html">Contacto</a></li>
                <li class="item"><a href="../pages/cart.html">Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Sección Contacto -->
        <section class="contact">
            <h1 class="title-contact">Contactanos</h1>
            <form class="form-contact" action="" method="POST">
                <div class="group-input">
                    <label for="name">Nombre: </label>
                    <input id="name" type="text" name="name">
                </div>

                <div class="group-input">
                    <label for="email">Email: </label>
                    <input id="email" type="email" name="email">
                </div>

                <div class="group-input">
                    <label for="message">Mensaje: </label>
                    <textarea id="message" name="message"></textarea>
                </div>
                <button class="btn-contact">Enviar</button>
            </form>
        </section>
        
    </main>

    <footer>
        <h4 class="footer-title">Tienda online Pepita</h4>
        <nav class="nav-footer">
            <ul class="nav-footer-redes">
                <li class="item"><a href="http://instagram.com/libreriatiendapepita"><img src="../img/logo-instagram.webp" alt="Logo Instagram" class="logo-instagram"></a></li>
                <li class="item"><a href="http://facebook.com/libreriatiendapepita"><img src="../img/logo-facebook.webp" alt="Logo Facebook" class="logo-facebook"></a></li>
                <li class="item"><a href="http://tiktok.com/libreriatiendapepita"><img src="../img/logo-tiktok.webp" alt="Logo Tik Tok" class="logo-tiktok"></a></li>
            </ul>

            <ul class="nav-footer-pages">
                <li class="item"><a href="../index.html">Inicio</a></li>
                <li class="item"><a href="../pages/contact.html">Contacto</a></li>
                <li class="item"><a href="../pages/cart.html">Carrito</a></li>
            </ul>

        </nav>
    </footer>
</body>
</html>
